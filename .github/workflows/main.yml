name: Deploy Website
on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy naar DirectAdmin
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build website
        run: npm run build

      - name: 📂 FTP Upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          
          # Jouw specifieke pad:
          server-dir: domains/luisterbingo.nl/public_html/
          
          # We gebruiken nu standaard FTP om de 'ECONNRESET' fout te voorkomen:
          protocol: ftp
          port: 21
